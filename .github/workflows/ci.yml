name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ritrovo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test (PostgreSQL in memoria, PGlite)
        run: npm test
      - name: Test di accettazione su PostgreSQL 16
        run: npm run test:acceptance
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ritrovo_test
      - run: npm run build
      - name: Manifest dell'add-in (controlli locali + validazione Microsoft)
        run: |
          npm run manifest -- --url https://prenotazioni.esempio.it
          npm run manifest:validate
